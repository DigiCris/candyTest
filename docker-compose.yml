services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candy
      POSTGRES_USER: candy
      POSTGRES_PASSWORD: candy_local_password
    volumes:
      - candy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candy -d candy"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgres://candy:candy_local_password@db:5432/candy
      JWT_SECRET: candy-demo-jwt-secret-change-before-production-2026
      ALLOW_DEMO_BOOTSTRAP: "true"
      CONFIG_PATH: /app/config/demo.constants.json
      PORT: "3001"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  candy_postgres_data:
